<script>
        function switchTab(tabId) {
            const tabs = ['history', 'stats'];
            const buttons = document.querySelectorAll('.border-b-2');
            
            tabs.forEach(id => {
                const el = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    el.classList.remove('hidden');
                    el.classList.add('block');
                } else {
                    el.classList.remove('block');
                    el.classList.add('hidden');
                }
            });

            // Very basic tab button styling update for demo purposes
            const tabContainer = document.querySelector('.flex.gap-4.border-b');
            const btns = tabContainer.querySelectorAll('button');
            btns.forEach(btn => {
                if(btn.innerText.includes(tabId === 'history' ? '历史' : '统计')) {
                    btn.className = "pb-2 font-headline-md text-body-lg text-primary border-b-2 border-primary font-medium";
                } else {
                    btn.className = "pb-2 font-headline-md text-body-lg text-on-surface-variant hover:text-on-surface font-medium transition-colors";
                }
            })
        }
