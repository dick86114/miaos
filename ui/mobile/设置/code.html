<style>
        body {
            background-color: #131315;
            color: #e5e1e4;
        }
        .cyber-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid #27272A;
            border-radius: 8px;
        }
        .cyber-input {
            background: #18181B;
            border: 1px solid #27272A;
            border-radius: 8px;
            color: #e5e1e4;
        }
        .cyber-input:focus {
            border-color: #d0bcff;
            outline: none;
        }
        .glass-nav {
            background: rgba(19, 19, 21, 0.8);
            backdrop-filter: blur(20px);
        }

    body {
      min-height: max(884px, 100dvh);

<body class="antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-surface-stroke flat no shadows">
<div class="flex items-center justify-between px-margin-screen h-16 w-full">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest/50 transition-colors duration-200 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary">妙生</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest/50 transition-colors duration-200 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-margin-screen pb-safe max-w-4xl mx-auto w-full">
<div class="flex flex-col gap-section-gap">
<!-- 外观设置 -->
<section class="flex flex-col gap-unit-4">
<h2 class="font-headline-md text-headline-md text-on-surface">外观设置</h2>
<div class="cyber-card p-card-padding flex gap-4">
<button class="flex-1 py-3 px-4 rounded-8 border border-surface-stroke text-on-surface-variant hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">light_mode</span>
<span class="font-body-md text-body-md">明亮</span>
</button>
<button class="flex-1 py-3 px-4 rounded-8 bg-primary/20 border border-primary text-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined">dark_mode</span>
<span class="font-body-md text-body-md">暗黑</span>
</button>
<button class="flex-1 py-3 px-4 rounded-8 border border-surface-stroke text-on-surface-variant hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">settings_system_daydream</span>
<span class="font-body-md text-body-md">跟随系统</span>
</button>
</div>
</section>
<!-- 默认模型管理 -->
<section class="flex flex-col gap-unit-4">
<h2 class="font-headline-md text-headline-md text-on-surface">默认模型管理</h2>
<div class="cyber-card p-card-padding flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-xs text-label-xs text-on-surface-variant uppercase">图像生成模型</label>
<div class="relative">
<select class="cyber-input w-full p-3 appearance-none font-body-md text-body-md">
<option>Stable Diffusion XL</option>
<option>Stable Diffusion v1.5</option>
<option>Midjourney v6</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-xs text-label-xs text-on-surface-variant uppercase">文本辅助模型</label>
<div class="relative">
<select class="cyber-input w-full p-3 appearance-none font-body-md text-body-md">
<option>GPT-4o</option>
<option>Claude 3.5 Sonnet</option>
<option>Llama 3 70B</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</section>
<!-- 数据迁移 -->
<section class="flex flex-col gap-unit-4">
<h2 class="font-headline-md text-headline-md text-on-surface">数据迁移</h2>
<div class="cyber-card p-card-padding flex flex-col gap-6">
<div class="flex flex-col gap-4">
<button class="w-full py-4 px-6 bg-primary text-on-primary rounded-8 font-body-md text-body-md font-semibold flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">lock</span>
                            导出加密配置
                        </button>
<button class="w-full py-4 px-6 border border-primary text-primary rounded-8 font-body-md text-body-md font-semibold flex items-center justify-center gap-2 hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
                            扫描二维码导入
                        </button>
</div>
<div class="flex justify-between items-center pt-4 border-t border-surface-stroke">
<span class="font-body-md text-body-md text-on-surface-variant">本地缓存使用量</span>
<div class="flex items-center gap-2">
<span class="font-code-sm text-code-sm text-on-surface">1.2 GB / 5.0 GB</span>
<div class="w-24 h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4"></div>
</div>
</div>
</div>
</div>
</section>
<!-- 关于妙生 -->
<section class="flex flex-col gap-unit-4">
<h2 class="font-headline-md text-headline-md text-on-surface">关于妙生</h2>
<div class="cyber-card p-card-padding flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">妙生</span>
<span class="font-code-sm text-code-sm text-on-surface-variant mt-1">版本号 V1.2.0 (Stable)</span>
</div>
<button class="py-2 px-4 border border-surface-stroke text-on-surface-variant rounded-8 font-body-md text-body-md hover:border-primary hover:text-primary transition-colors">
                        检查更新
                    </button>
</div>
</section>
</div>

<span class="material-symbols-outlined">bolt</span>
<span class="font-label-xs text-label-xs mt-1">快速生图</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline px-3 py-1 hover:text-on-surface transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined">folder_open</span>
<span class="font-label-xs text-label-xs mt-1">项目</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline px-3 py-1 hover:text-on-surface transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-xs text-label-xs mt-1">历史</span>

<a class="flex flex-col items-center justify-center text-outline dark:text-outline px-3 py-1 hover:text-on-surface transition-all duration-300 active:scale-90" href="#">

<span class="font-label-xs text-label-xs mt-1">统计</span>

<a class="flex flex-col items-center justify-center text-primary dark:text-primary bg-primary-container/20 rounded-xl px-3 py-1 transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-xs text-label-xs mt-1">设置</span>
</a>
