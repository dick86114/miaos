name: Build And Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build And Release：v{0}，{1}', inputs.version, inputs.release_notes) || 'Build And Release：CI 构建' }}

# 触发方式：
# 1. push 到 main 分支 → 仅构建验证，上传 artifact（不发布 Release）
# 2. 手动触发 → 填写版本号与更新内容 → 构建并发布 GitHub Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.2）'
        required: true
        type: string
      release_notes:
        description: '更新内容（多行，支持 Markdown）'
        required: true
        type: string
      prerelease:
        description: '是否为预发布版本'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-14  # Apple Silicon (M1) runner，原生 arm64
    # 发布 Release 需要写权限；CI 模式（push）默认只读权限即可
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Override version (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('版本号已更新为: ' + pkg.version);
          "

      - name: Build DMG
        run: pnpm dist

      - name: Verify app signature and architecture
        run: |
          codesign --verify --deep --strict release/mac-arm64/miaos.app
          file release/mac-arm64/miaos.app/Contents/MacOS/miaos | grep arm64

      - name: Verify artifacts
        run: |
          echo "=== 构建产物 ==="
          ls -lh release/*.dmg release/*.zip release/*.yml 2>/dev/null || true
          echo "=== DMG 信息 ==="
          file release/*.dmg
          echo "=== latest-mac.yml ==="
          cat release/latest-mac.yml || echo "❌ latest-mac.yml 不存在！自动更新将无法工作"

      - name: Get DMG filename
        id: dmg
        run: |
          DMG_FILE=$(ls release/*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_FILE")
          echo "path=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "name=$DMG_NAME" >> $GITHUB_OUTPUT

      # ===== CI 模式（push 触发）：仅上传 artifact 供下载测试 =====
      - name: Upload artifact (CI)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: miaos-dmg-ci
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      # ===== Release 模式（手动触发）：创建 GitHub Release =====
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: 妙生 ${{ inputs.version }}
          body: |
            ## 妙生 miaos ${{ inputs.version }}

            ${{ inputs.release_notes }}

            ---

            ### 安装方法

            1. 下载下方的 `${{ steps.dmg.outputs.name }}` 文件
            2. 双击挂载 DMG
            3. 双击 DMG 窗口中的「安装妙生.command」脚本
            4. 在终端中按提示完成安装（脚本会自动复制到 `/Applications` 并执行 `xattr -cr` 解除安全限制）

            ### 系统要求

            - macOS 12+（Apple Silicon）
            - 首次打开若被 Gatekeeper 拦截：系统设置 → 隐私与安全性 → 仍要打开
          files: |
            release/*.dmg
            release/latest-mac.yml
            release/*-mac.zip
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
