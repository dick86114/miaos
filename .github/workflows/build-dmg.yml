name: Build & Release DMG

# 触发条件：
# 1. 推送 v* 格式的 tag（如 v1.0.0）→ 构建并发布 GitHub Release
# 2. 手动触发（workflow_dispatch）→ 仅构建，上传 artifact 供下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-14  # Apple Silicon (M1) runner，原生 arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run dist

      - name: Verify artifact
        run: |
          echo "=== 构建产物 ==="
          ls -lh release/*.dmg
          echo "=== 文件信息 ==="
          file release/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miaos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 妙生 ${{ github.ref_name }}
          body: |
            ## 妙生 miaos ${{ github.ref_name }}

            ### 安装方法

            1. 下载下方的 `miaos-*.dmg` 文件
            2. 双击挂载 DMG
            3. 双击 DMG 窗口中的「安装妙生.command」脚本
            4. 在终端中按提示完成安装（脚本会自动复制到 `/Applications` 并执行 `xattr -cr` 解除安全限制）

            ### 系统要求

            - macOS 12+（Apple Silicon）
            - 首次打开若被 Gatekeeper 拦截：系统设置 → 隐私与安全性 → 仍要打开
          files: release/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
